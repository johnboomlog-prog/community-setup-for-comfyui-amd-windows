name: Build release packages

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build standalone EXE and portable ZIP
        shell: powershell
        run: |
          $version = if ('${{ github.ref_type }}' -eq 'tag') { '${{ github.ref_name }}'.TrimStart('v') } else { 'dev' }
          .\packaging\build-release.ps1 -Version $version

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: community-setup-for-comfyui-amd-windows
          path: |
            dist/Community-Setup-for-ComfyUI-AMD-Windows.exe
            dist/Community-Setup-for-ComfyUI-AMD-Windows-portable.zip
            dist/SHA256SUMS.txt

      - name: Attach files to GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/Community-Setup-for-ComfyUI-AMD-Windows.exe
            dist/Community-Setup-for-ComfyUI-AMD-Windows-portable.zip
            dist/SHA256SUMS.txt
